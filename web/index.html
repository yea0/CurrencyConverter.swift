<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold text-gray-800 mb-2">💱 Currency Converter</h1>
            <p class="text-gray-600 text-lg">Convert currencies in real-time</p>
        </div>

        <!-- Main Card -->
        <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-2xl p-8">
            <!-- From Currency -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-700 mb-2">From</label>
                <div class="flex gap-4">
                    <input 
                        type="number" 
                        id="fromAmount" 
                        value="1"
                        class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                        placeholder="Amount"
                    >
                    <select 
                        id="fromCurrency" 
                        class="px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition bg-white"
                    >
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                        <option value="CHF">CHF</option>
                        <option value="CNY">CNY</option>
                    </select>
                </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center mb-8">
                <button 
                    id="swapBtn"
                    class="bg-blue-500 hover:bg-blue-600 text-white rounded-full p-3 transition transform hover:scale-110 shadow-lg"
                    title="Swap currencies"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                    </svg>
                </button>
            </div>

            <!-- To Currency -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-700 mb-2">To</label>
                <div class="flex gap-4">
                    <input 
                        type="number" 
                        id="toAmount" 
                        readonly
                        class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-700"
                        placeholder="Result"
                    >
                    <select 
                        id="toCurrency" 
                        class="px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition bg-white"
                    >
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                        <option value="CHF">CHF</option>
                        <option value="CNY">CNY</option>
                    </select>
                </div>
            </div>

            <!-- Exchange Rate Info -->
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded mb-8">
                <p class="text-gray-700">
                    <span id="rateInfo" class="font-semibold text-blue-600">1 USD = 0.92 EUR</span>
                </p>
            </div>

            <!-- Convert Button -->
            <button 
                id="convertBtn"
                class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg"
            >
                Convert
            </button>
        </div>

        <!-- History Section -->
        <div class="max-w-2xl mx-auto mt-12">
            <div class="bg-white rounded-xl shadow-2xl p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Conversion History</h2>
                <div id="historyList" class="space-y-3">
                    <p class="text-gray-500 text-center py-4">No conversions yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
